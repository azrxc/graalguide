<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graal Head/Body Offset Calibration</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    canvas {
      background: #333;
      margin-top: 20px;
      image-rendering: pixelated;
      border: 2px solid white;
    }
    .controls {
      margin-top: 15px;
    }
    input {
      margin: 5px;
    }
    #offset {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>⚙️ Graal Offset Calibration Tool</h1>

  <div class="controls">
    Upload Head: <input type="file" id="headUpload" accept=".png,.gif">
    Upload Body: <input type="file" id="bodyUpload" accept=".png,.gif">
  </div>

  <canvas id="viewer" width="128" height="128"></canvas>

  <p>➡️ Arrow Keys = Change direction | WASD = Move head | Space = Reset</p>
  <div id="offset">Head Offset: (X: 48, Y: 10)</div>

  <script>
    const canvas = document.getElementById("viewer");
    const ctx = canvas.getContext("2d");

    // Default graphics
    let headImg = new Image();
    let bodyImg = new Image();
    headImg.src = "https://i.ibb.co/6gx1r4P/noobhead.gif"; 
    bodyImg.src = "https://i.ibb.co/VxFt2wC/noobody.png"; 

    // Upload listeners
    document.getElementById("headUpload").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        headImg = new Image();
        headImg.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("bodyUpload").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        bodyImg = new Image();
        bodyImg.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Directions
    const directions = ["down", "up", "left", "right"];
    let currentDir = "down";

    // Head offsets
    let offsetX = 48;
    let offsetY = 10;

    // Keyboard input
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp") currentDir = "up";
      if (e.key === "ArrowDown") currentDir = "down";
      if (e.key === "ArrowLeft") currentDir = "left";
      if (e.key === "ArrowRight") currentDir = "right";

      if (e.key.toLowerCase() === "w") offsetY--;
      if (e.key.toLowerCase() === "s") offsetY++;
      if (e.key.toLowerCase() === "a") offsetX--;
      if (e.key.toLowerCase() === "d") offsetX++;

      if (e.code === "Space") { offsetX = 48; offsetY = 10; }

      document.getElementById("offset").innerText = 
        `Head Offset: (X: ${offsetX}, Y: ${offsetY}) | Dir: ${currentDir}`;
      console.log(`Dir=${currentDir} Offset=(${offsetX},${offsetY})`);
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (bodyImg.complete) {
        let row = directions.indexOf(currentDir);
        ctx.drawImage(bodyImg, 0, row * 128, 128, 128, 0, 0, 128, 128);
      }

      if (headImg.complete) {
        ctx.drawImage(headImg, 0, 0, 32, 32, offsetX, offsetY, 32, 32);
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
