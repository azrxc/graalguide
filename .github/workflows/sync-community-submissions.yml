name: Sync approved community submissions

# Schedule trigger is deliberately OFF until the one-time setup is done
# (ADMIN_KEY secret on the Worker + GRAALGUIDE_ADMIN_KEY here) - see
# project-graalguide-community-submission-pipeline in the assistant's memory
# for the full checklist. Without that setup every scheduled run just
# hard-fails at the ADMIN_KEY check in scripts/sync-community-submissions.mjs,
# which spammed a failure email every 30 minutes for days before this was
# caught. Once setup is confirmed done, uncomment the schedule block below
# (or just trigger manually via workflow_dispatch whenever a sync is wanted).
on:
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull approved submissions into the repo
        env:
          ADMIN_KEY: ${{ secrets.GRAALGUIDE_ADMIN_KEY }}
        run: node scripts/sync-community-submissions.mjs

      - name: Commit and push
        id: commit
        run: |
          if [ ! -f .sync-output.json ]; then
            echo "Nothing to sync this run."
            exit 0
          fi
          git config user.name "graalguide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ image/
          git commit -m "Auto-sync approved community submissions"
          git push

      - name: Mark synced submissions
        if: hashFiles('.sync-output.json') != ''
        env:
          ADMIN_KEY: ${{ secrets.GRAALGUIDE_ADMIN_KEY }}
        run: node scripts/mark-submissions-synced.mjs
