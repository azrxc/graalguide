name: Sync approved community submissions

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull approved submissions into the repo
        env:
          ADMIN_KEY: ${{ secrets.GRAALGUIDE_ADMIN_KEY }}
        run: node scripts/sync-community-submissions.mjs

      - name: Commit and push
        id: commit
        run: |
          if [ ! -f .sync-output.json ]; then
            echo "Nothing to sync this run."
            exit 0
          fi
          git config user.name "graalguide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ image/
          git commit -m "Auto-sync approved community submissions"
          git push

      - name: Mark synced submissions
        if: hashFiles('.sync-output.json') != ''
        env:
          ADMIN_KEY: ${{ secrets.GRAALGUIDE_ADMIN_KEY }}
        run: node scripts/mark-submissions-synced.mjs
